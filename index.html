<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Health Freedom Index</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Health Freedom Index</h1>
      <p>Weight what matters to you. Every U.S. county is scored 0&ndash;100.</p>
    </div>
    <div class="topbar-controls">
      <input id="search" type="search" placeholder="Find a county…" autocomplete="off" aria-label="Find a county">
      <select id="preset" aria-label="Weighting preset">
        <option value="">Preset…</option>
      </select>
      <button id="reset" type="button">Reset</button>
    </div>
  </header>

  <main>
    <aside class="panel" id="panel">
      <div class="panel-intro">
        <p id="data-status" class="status">Loading…</p>
        <p id="active-count" class="active-count"></p>
        <p class="scale-hint">1 = Not at all important &nbsp;&rarr;&nbsp; 7 = Extremely important</p>
        <p class="scale-hint">Categories follow the UW Population Health Institute 2025 Model of Health &mdash; Community Conditions.</p>
      </div>
      <div id="categories"></div>

      <section class="category">
        <div class="category-head"><h2>Top counties for you</h2></div>
        <ol id="leaderboard" class="leaderboard"></ol>
      </section>
    </aside>

    <div class="map-wrap">
      <div id="map"></div>
      <div id="hover" class="hover-box"></div>
      <div class="legend">
        <span class="legend-title">Your index</span>
        <div id="legend-scale" class="legend-scale"></div>
        <div class="legend-labels"><span id="legend-min">0</span><span id="legend-mid">50</span><span id="legend-max">100</span><span class="nd">n/a</span></div>
      </div>
      <div id="detail" class="detail"></div>
    </div>
  </main>

  <datalist id="importance-ticks">
    <option value="1"></option><option value="2"></option><option value="3"></option>
    <option value="4"></option><option value="5"></option><option value="6"></option>
    <option value="7"></option>
  </datalist>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/indicators.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
